name: Deploy openGym site

# The site is committed as one site.zip (~40 MB, 6,643 files): the contents API and the web
# uploader are both impractical for that many files. Actions unpacks it and publishes the result
# to Pages, so the repository stays readable and the artifact carries the site.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Python's zipfile rather than unzip: unzip returns 1 for "success with warning" on archives
      # written by Windows tools, and this shell runs with -e, so a warning used to fail the job.
      - name: Unpack the site
        run: |
          rm -rf _site
          mkdir -p _site
          python3 -m zipfile -e site.zip _site
          test -f _site/index.html
          echo "files: $(find _site -type f | wc -l)"
          du -sh _site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
